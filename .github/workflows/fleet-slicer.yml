name: Fleet headless slicer
on:
  workflow_dispatch:
    inputs:
      run_deploy:
        description: Deploy the accepted worker image after publishing
        required: false
        default: false
        type: boolean
  push:
    branches: [fleet-slicer]
permissions:
  contents: read
env:
  IMAGE: docker.io/jmarji/unlayered-slicer
jobs:
  image:
    if: github.repository_owner == 'Modovolo'
    runs-on: ubuntu-24.04
    # A cold dependency build (Boost, OCCT, OpenCV, ...) exceeds three hours.
    # 360 minutes is the GitHub-hosted maximum; warm compiler caches finish far sooner.
    timeout-minutes: 360
    outputs:
      image_ref: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify project adapter and private worker lifecycle
        run: |
          python -m pip install aiohttp pytest pytest-asyncio
          python -m pytest slicer_service tests/test_fleet_build_progress.py -q
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          username: jmarji
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve immutable input keys
        id: keys
        env:
          DEPS_KEY: ${{ hashFiles('deps/**', 'cmake/**', 'Dockerfile.slicer', 'scripts/fleet_build_progress.py') }}
          ENGINE_KEY: ${{ hashFiles('src/**', 'deps_src/**', 'resources/**', 'localization/**', 'CMakeLists.txt', 'version.inc', 'scripts/**', 'tests/**', 'tools/**') }}
        # Docker tags are limited to 128 characters; two full SHA-256 keys exceed it.
        run: |
          echo "deps=$IMAGE:deps-${DEPS_KEY:0:24}" >> "$GITHUB_OUTPUT"
          echo "engine=$IMAGE:engine-${DEPS_KEY:0:24}-${ENGINE_KEY:0:24}" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: compiler-cache
          key: unlayered-compiler-amd64-clang-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unlayered-compiler-amd64-clang-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"compiler-cache": "/compiler-cache"}'
          skip-extraction: true
      - name: Publish dependencies independently
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer
          target: deps
          # Standard runners have 4 vCPUs and 16 GB of memory; four clang jobs fit.
          build-args: |
            DEPS_CACHE_KEY=${{ hashFiles('deps/**', 'cmake/**', 'Dockerfile.slicer', 'scripts/fleet_build_progress.py') }}
            BUILD_JOBS=4
          push: true
          tags: ${{ steps.keys.outputs.deps }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:deps-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:deps-cache,mode=max
      - name: Publish compiled engine independently
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer
          target: engine
          push: true
          tags: ${{ steps.keys.outputs.engine }}
          build-args: |
            DEPS_IMAGE=${{ steps.keys.outputs.deps }}
            BUILD_JOBS=4
          cache-from: type=registry,ref=${{ env.IMAGE }}:engine-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:engine-cache,mode=max
      - name: Acceptance tests and service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            DEPS_IMAGE=${{ steps.keys.outputs.deps }}
            ENGINE_IMAGE=${{ steps.keys.outputs.engine }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:service-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:service-cache,mode=max
      # Explicit extraction and save also run after failed or canceled builds.
      # The combined cache action only saves in its success-only post step.
      - name: Extract compiler cache even after build failure
        id: extract_cache
        if: always() && steps.compiler_cache.outcome == 'success' && steps.buildx.outcome == 'success'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/fleet-cache-context"
          docker buildx build --builder "$BUILDER" --progress=plain \
            --output "type=local,dest=$RUNNER_TEMP/fleet-compiler-cache-export" \
            -f - "$RUNNER_TEMP/fleet-cache-context" <<'DOCKERFILE'
          FROM ghcr.io/containerd/busybox:latest AS cache
          RUN --mount=type=cache,target=/compiler-cache mkdir /export && cp -a /compiler-cache/. /export/
          FROM scratch
          COPY --from=cache /export/ /
          DOCKERFILE
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "fleet-compiler-cache-export"
          target = Path("compiler-cache")
          if target.exists(): shutil.rmtree(target)
          shutil.move(str(source), str(target))
          PY
      - name: Save compiler cache even after build failure
        if: always() && steps.extract_cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: compiler-cache
          key: unlayered-compiler-amd64-clang-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    name: Deploy accepted worker
    needs: image
    if: github.event_name == 'push' || github.event.inputs.run_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: fleet
      DEPLOYMENT_NAME: unlayered-slicer
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          LKE_KUBECONFIG: ${{ secrets.LKE_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "$LKE_KUBECONFIG" ]]; then
            echo "Missing required secret: LKE_KUBECONFIG"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$LKE_KUBECONFIG" | grep -q 'apiVersion:'; then
            printf '%s\n' "$LKE_KUBECONFIG" > "$HOME/.kube/config"
          elif ! printf '%s' "$LKE_KUBECONFIG" | base64 --decode > "$HOME/.kube/config" 2>/dev/null; then
            echo "LKE_KUBECONFIG is neither raw kubeconfig nor valid base64"
            exit 1
          fi
          chmod 600 "$HOME/.kube/config"
      # Fleet Manager and the worker share this token. It is generated in the
      # cluster once and never leaves it; an existing token is kept.
      - name: Ensure shared worker token
        id: token
        run: |
          set -euo pipefail
          if kubectl -n "$NAMESPACE" get secret fleet-slicer-secrets >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            kubectl -n "$NAMESPACE" create secret generic fleet-slicer-secrets \
              --from-literal=worker-token="$(openssl rand -hex 32)"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Roll out worker
        run: |
          set -euo pipefail
          kubectl apply -f k8s/unlayered-slicer.yaml
          kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT_NAME" "$DEPLOYMENT_NAME=${{ needs.image.outputs.image_ref }}"
          if ! kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT_NAME" --timeout=600s; then
            echo "::group::Pods"
            kubectl -n "$NAMESPACE" describe pods -l app=unlayered-slicer || true
            echo "::endgroup::"
            echo "::group::Logs"
            kubectl -n "$NAMESPACE" logs "deployment/$DEPLOYMENT_NAME" --tail=200 || true
            echo "::endgroup::"
            echo "::group::Recent events"
            kubectl -n "$NAMESPACE" get events --sort-by=.metadata.creationTimestamp | tail -n 50 || true
            echo "::endgroup::"
            exit 1
          fi
      # Fleet Manager reads the optional token only at pod start.
      - name: Restart Fleet Manager for a new token
        if: steps.token.outputs.created == 'true'
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout restart deployment/fleet-manager
          kubectl -n "$NAMESPACE" rollout status deployment/fleet-manager --timeout=600s
      # The browser reaches slicing only through Fleet Manager's /api/slicer facade.
      # fleet-orchestration/k8s/ingress.yaml carries the same path.
      - name: Route /api/slicer to Fleet Manager
        run: |
          set -euo pipefail
          PATHS="$(kubectl -n "$NAMESPACE" get ingress fleet-ingress -o jsonpath='{.spec.rules[0].http.paths[*].path}')"
          if [[ " $PATHS " != *" /api/slicer "* ]]; then
            kubectl -n "$NAMESPACE" patch ingress fleet-ingress --type json -p '[{"op":"add","path":"/spec/rules/0/http/paths/0","value":{"path":"/api/slicer","pathType":"Prefix","backend":{"service":{"name":"fleet-manager","port":{"number":8080}}}}}]'
          fi
      - name: Verify Fleet Manager reaches the worker
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" exec deploy/fleet-manager -c fleet-manager -- python3 -c '
          import json, os, urllib.request
          request = urllib.request.Request("http://unlayered-slicer:8090/health", headers={"X-Service-Token": os.environ["SLICER_WORKER_TOKEN"]})
          print(json.dumps(json.load(urllib.request.urlopen(request, timeout=10))))
          '
