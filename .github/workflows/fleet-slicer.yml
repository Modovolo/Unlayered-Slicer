name: Fleet headless slicer
on:
  workflow_dispatch:
  push:
    branches: [fleet-slicer]
permissions:
  contents: read
env:
  IMAGE: docker.io/jmarji/unlayered-slicer
jobs:
  image:
    if: github.repository_owner == 'Modovolo'
    runs-on: ubuntu-24.04
    # A cold dependency build (Boost, OCCT, OpenCV, ...) exceeds three hours.
    # 360 minutes is the GitHub-hosted maximum; warm compiler caches finish far sooner.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify project adapter and private worker lifecycle
        run: |
          python -m pip install aiohttp pytest pytest-asyncio
          python -m pytest slicer_service tests/test_fleet_build_progress.py -q
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - uses: docker/login-action@v3
        with:
          username: jmarji
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve immutable input keys
        id: keys
        env:
          DEPS_KEY: ${{ hashFiles('deps/**', 'cmake/**', 'Dockerfile.slicer', 'scripts/fleet_build_progress.py') }}
          ENGINE_KEY: ${{ hashFiles('src/**', 'deps_src/**', 'resources/**', 'localization/**', 'CMakeLists.txt', 'version.inc', 'scripts/**', 'tests/**', 'tools/**') }}
        # Docker tags are limited to 128 characters; two full SHA-256 keys exceed it.
        run: |
          echo "deps=$IMAGE:deps-${DEPS_KEY:0:24}" >> "$GITHUB_OUTPUT"
          echo "engine=$IMAGE:engine-${DEPS_KEY:0:24}-${ENGINE_KEY:0:24}" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v4
        with:
          path: compiler-cache
          key: unlayered-compiler-amd64-clang-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unlayered-compiler-amd64-clang-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{"compiler-cache": "/compiler-cache"}'
          skip-extraction: true
      - name: Publish dependencies independently
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer
          target: deps
          # Standard runners have 4 vCPUs and 16 GB of memory; four clang jobs fit.
          build-args: |
            DEPS_CACHE_KEY=${{ hashFiles('deps/**', 'cmake/**', 'Dockerfile.slicer', 'scripts/fleet_build_progress.py') }}
            BUILD_JOBS=4
          push: true
          tags: ${{ steps.keys.outputs.deps }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:deps-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:deps-cache,mode=max
      - name: Publish compiled engine independently
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer
          target: engine
          push: true
          tags: ${{ steps.keys.outputs.engine }}
          build-args: |
            DEPS_IMAGE=${{ steps.keys.outputs.deps }}
            BUILD_JOBS=4
          cache-from: type=registry,ref=${{ env.IMAGE }}:engine-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:engine-cache,mode=max
      - name: Acceptance tests and service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slicer
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            DEPS_IMAGE=${{ steps.keys.outputs.deps }}
            ENGINE_IMAGE=${{ steps.keys.outputs.engine }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:service-cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:service-cache,mode=max
      # Explicit extraction and save also run after failed or canceled builds.
      # The combined cache action only saves in its success-only post step.
      - name: Extract compiler cache even after build failure
        id: extract_cache
        if: always() && steps.compiler_cache.outcome == 'success' && steps.buildx.outcome == 'success'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/fleet-cache-context"
          docker buildx build --builder "$BUILDER" --progress=plain \
            --output "type=local,dest=$RUNNER_TEMP/fleet-compiler-cache-export" \
            -f - "$RUNNER_TEMP/fleet-cache-context" <<'DOCKERFILE'
          FROM ghcr.io/containerd/busybox:latest AS cache
          RUN --mount=type=cache,target=/compiler-cache mkdir /export && cp -a /compiler-cache/. /export/
          FROM scratch
          COPY --from=cache /export/ /
          DOCKERFILE
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          source = Path(os.environ["RUNNER_TEMP"]) / "fleet-compiler-cache-export"
          target = Path("compiler-cache")
          if target.exists(): shutil.rmtree(target)
          shutil.move(str(source), str(target))
          PY
      - name: Save compiler cache even after build failure
        if: always() && steps.extract_cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: compiler-cache
          key: unlayered-compiler-amd64-clang-${{ github.run_id }}-${{ github.run_attempt }}
